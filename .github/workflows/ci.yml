# Mismo flujo que app/Jenkinsfile, ejecutado por GitHub Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias
        run: pytest -v --junitxml=reports/junit.xml
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: app/reports/

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t inventario:${{ github.run_number }} app
      - name: Prueba de humo
        run: |
          docker run -d --name inventario-humo -p 8000:8000 inventario:${{ github.run_number }}
          sleep 3
          curl -fsS http://localhost:8000/health
          docker rm -f inventario-humo
