services:
  jenkins:
    build: .
    image: jenkins-clase:lts
    container_name: jenkins-clase
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-cambiar-esta-clave}
    # Grupo dueño del socket de Docker (en Linux: stat -c %g /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins.yaml:/casc/jenkins.yaml:ro
      # Permite que Jenkins lance contenedores usando el Docker del host (solo laboratorio).
      - /var/run/docker.sock:/var/run/docker.sock
      # Plan B: la raíz del proyecto (donde está .git) como repositorio local.
      - ..:/repo-local:ro

volumes:
  jenkins_home:
